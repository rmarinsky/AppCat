name: Secret scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - name: Scan every outbound commit and the tracked tree
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/check-secrets.sh range "$SCAN_BASE..$SCAN_HEAD"
          bash scripts/check-secrets.sh tree
