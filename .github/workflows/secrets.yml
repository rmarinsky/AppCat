name: Secret scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          cache: false
      - name: Install pinned ripsecrets scanner
        run: cargo install --locked --version 0.1.11 ripsecrets
      - name: Scan every outbound commit and the tracked tree
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml \
            --output "$RUNNER_TEMP/gitleaks.toml"
          echo 'e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf  '"$RUNNER_TEMP/gitleaks.toml" | sha256sum --check --status

          scanner_image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb'
          mkdir "$RUNNER_TEMP/tracked-tree"
          GIT_INDEX_FILE="$RUNNER_TEMP/scan-index" git read-tree "$SCAN_HEAD"
          GIT_INDEX_FILE="$RUNNER_TEMP/scan-index" \
            git checkout-index --all --prefix="$RUNNER_TEMP/tracked-tree/"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" --workdir /repo \
            "$scanner_image" git --redact --no-banner --config=/gitleaks.toml \
            --gitleaks-ignore-path=/dev/null --log-opts="$SCAN_BASE..$SCAN_HEAD"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$RUNNER_TEMP/tracked-tree:/repo:ro" \
            --volume "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" --workdir /repo \
            "$scanner_image" dir --redact --no-banner --config=/gitleaks.toml \
            --gitleaks-ignore-path=/dev/null /repo

          tracked_paths=()
          while IFS= read -r -d '' path; do
            tracked_paths+=("$path")
            name="${path##*/}"
            case "$name" in
              .env.example|.env.template) ;;
              .env|.env.*|*.pem|*.key|*.p12|*.pfx|id_rsa|id_ed25519|credentials.json|secrets.json|*.sql.gz|*.dump)
                echo "Refusing credential/signing/dump path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-files -z)

          if [[ ${#tracked_paths[@]} -gt 0 ]]; then
            ripsecrets --strict-ignore "${tracked_paths[@]}" >/dev/null || {
              echo 'Tracked-file secret scan failed; suspected values are not printed.' >&2
              exit 1
            }
          fi
